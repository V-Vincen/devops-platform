server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: devops-platform
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:postgresql://localhost:15432/devops_platform}
    username: ${DB_USERNAME:devops_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 5000
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEVOPS}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEVOPS}
        import-check:
          enabled: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-value: true
      logic-not-delete-value: false

management:
  health:
    redis:
      enabled: ${DEVOPS_REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

devops:
  redis:
    enabled: ${DEVOPS_REDIS_ENABLED:false}
  security:
    enabled: ${DEVOPS_SECURITY_ENABLED:true}
    bootstrap-admin-username: ${DEVOPS_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${DEVOPS_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-developer-username: ${DEVOPS_BOOTSTRAP_DEVELOPER_USERNAME:}
    bootstrap-developer-password: ${DEVOPS_BOOTSTRAP_DEVELOPER_PASSWORD:}
    token-expire-hours: ${DEVOPS_TOKEN_EXPIRE_HOURS:12}
