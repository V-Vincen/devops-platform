# K3s 首次服务验证：镜像必须经 Nexus docker-group 拉取，并由 Traefik 暴露到测试入口。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ingress-check
  namespace: dev
  labels:
    app.kubernetes.io/name: nexus-ingress-check
    app.kubernetes.io/part-of: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-ingress-check
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-ingress-check
    spec:
      imagePullSecrets:
        - name: nexus-docker-group
      containers:
        - name: nginx
          image: host.docker.internal:18084/library/nginx:1.27-alpine
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-ingress-check
  namespace: dev
spec:
  selector:
    app.kubernetes.io/name: nexus-ingress-check
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress-check
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
    - host: k3s.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexus-ingress-check
                port:
                  name: http
