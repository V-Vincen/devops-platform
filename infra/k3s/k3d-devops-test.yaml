# 本机 macOS 的单节点 K3s 测试集群配置；不包含账号、密码或令牌。
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: devops-test
servers: 1
agents: 0
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "16443"
ports:
  # 仅暴露到回环地址，避免测试 Ingress 意外对局域网公开。
  - port: "127.0.0.1:18088:80"
    nodeFilters:
      - loadbalancer
  - port: "127.0.0.1:18443:443"
    nodeFilters:
      - loadbalancer
registries:
  # K3s 节点通过 Docker Desktop 回到宿主机的 Nexus Docker Group。
  # 账号由 Kubernetes imagePullSecret 注入，不能写入此配置。
  config: |
    mirrors:
      "host.docker.internal:18084":
        endpoint:
          - "http://host.docker.internal:18084"
options:
  k3d:
    wait: true
    timeout: "180s"
